# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Keep class/member names. The libxposed module entry and hook classes are
# referenced by name from META-INF/xposed/java_init.list, so they must not be
# obfuscated away.
android.enableR8.fullMode=false
