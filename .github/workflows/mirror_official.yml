name: Sync to Official Mirror

on:
  release:
    types: [published]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Generate Metadata
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          
          # 1. Extract Package ID
          PACKAGE_ID=$(grep "applicationId =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          
          # 2. Dynamic Target Repo
          ORG_NAME="Xposed-Modules-Repo"
          TARGET_REPO="$ORG_NAME/$PACKAGE_ID"
          
          # 3. Clone Official Repo
          git clone https://x-access-token:${{ secrets.MIRROR_REPO_TOKEN }}@github.com/$TARGET_REPO.git mirror
          
          # 4. Extract App Name and Description
          APP_NAME=$(grep '<string name="app_name">' app/src/main/res/values/strings.xml | sed 's/.*>\(.*\)<.*/\1/')
          DESCRIPTION=$(grep 'android:name="xposeddescription"' app/src/main/AndroidManifest.xml | sed 's/.*android:value="\(.*\)".*/\1/')
          
          # 5. Generate module.prop
          cat <<EOF > mirror/module.prop
          id=$PACKAGE_ID
          name=$APP_NAME
          version=${{ github.event.release.tag_name }}
          versionCode=$(git tag | wc -l)
          author=${{ github.actor }}
          description=$DESCRIPTION
          support=https://github.com/$TARGET_REPO/issues
          EOF
          
          cp README.md mirror/
          cd mirror
          git add .
          git commit -m "Release ${{ github.event.release.tag_name }}" || exit 0
          git push origin main
          
          # Export for next steps
          echo "TARGET_REPO=$TARGET_REPO" >> $GITHUB_ENV

      - name: Fetch Artifacts
        run: gh release download ${{ github.event.release.tag_name }} --pattern "*.apk" --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Mirror Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.MIRROR_REPO_TOKEN }}
          files: "*.apk"
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
